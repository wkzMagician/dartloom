name: Pub package validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cli/dartloom_cli
          - packages/dartloom_settings
          - packages/dartloom_storage
          - packages/dartloom_logging
          - packages/dartloom_autostart
          - packages/dartloom_sync
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - run: dart pub publish --dry-run
