name: Pub package validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cli/dartloom_cli
          - packages/dartloom_settings
          - packages/dartloom_storage
          - packages/dartloom_logging
          - packages/dartloom_autostart
          - packages/dartloom_sync
          - packages/dartloom_localization
          - packages/dartloom_storage_file
          - packages/dartloom_storage_drift
          - packages/dartloom_storage_indexeddb
          - packages/dartloom_sync_storage
          - packages/dartloom_external_input
          - packages/dartloom_external_input_android
          - packages/dartloom_external_input_ios
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve workspace package dependencies
        shell: bash
        run: |
          case "$PACKAGE" in
            packages/dartloom_external_input_android|packages/dartloom_external_input_ios)
              printf '%s\n' \
                'dependency_overrides:' \
                '  dartloom_external_input:' \
                "    path: $GITHUB_WORKSPACE/packages/dartloom_external_input" \
                | tee pubspec_overrides.yaml
              ;;
            packages/dartloom_sync|packages/dartloom_storage_file|packages/dartloom_storage_drift|packages/dartloom_storage_indexeddb)
              printf '%s\n' \
                'dependency_overrides:' \
                '  dartloom_storage:' \
                "    path: $GITHUB_WORKSPACE/packages/dartloom_storage" \
                | tee pubspec_overrides.yaml
              ;;
            packages/dartloom_sync_storage)
              printf '%s\n' \
                'dependency_overrides:' \
                '  dartloom_settings:' \
                "    path: $GITHUB_WORKSPACE/packages/dartloom_settings" \
                '  dartloom_storage:' \
                "    path: $GITHUB_WORKSPACE/packages/dartloom_storage" \
                '  dartloom_sync:' \
                "    path: $GITHUB_WORKSPACE/packages/dartloom_sync" \
                | tee pubspec_overrides.yaml
              ;;
          esac

      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings

      - name: Publish dry-run for publishable packages
        shell: bash
        run: |
          case "$PACKAGE" in
            packages/dartloom_storage_file|packages/dartloom_storage_indexeddb|packages/dartloom_external_input_android|packages/dartloom_external_input_ios)
              echo "Skipping internal package: $PACKAGE"
              ;;
            *)
              flutter pub publish --dry-run
              ;;
          esac
