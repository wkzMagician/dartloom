name: Dartloom Cloud Build
on:
  workflow_dispatch:
    inputs:
      platform: { required: true, type: string }
      git_ref: { required: true, type: string }
      mode: { required: true, default: release, type: string }
      release: { required: true, default: 'false', type: boolean }
jobs:
  build:
    runs-on: ${{ fromJSON('{"windows":"windows-latest","linux":"ubuntu-latest","macos":"macos-latest","android":"ubuntu-latest","ios":"macos-latest","web":"ubuntu-latest"}')[inputs.platform] }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.git_ref }} }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build ${{ inputs.platform }} --${{ inputs.mode }}
      - run: mkdir -p artifact && echo '{"schema_version":1,"platform":"${{ inputs.platform }}","commit":"${{ github.sha }}"}' > artifact/dartloom-build.json
      - uses: actions/upload-artifact@v4
        with: { name: dartloom-${{ inputs.platform }}, path: artifact }
