schema_version: 6

app:
  name: example_app
  package_name: example-app
  organization: com.example
  description: Dartloom application

platforms:
  android: true
  ios: false
  windows: true
  macos: false
  linux: false
  web: false

capabilities:
  settings:
    instances:
      default:
        implementation: shared_preferences
  storage:
    instances:
      json:
        implementation: file_object_store
        options:
          path: Dartloom
          metadata_path: dartloom/sync-metadata/Dartloom
          hierarchical: false
  logging:
    instances:
      default:
        implementation: logger

sources:
  capabilities: github

release:
  github: true
