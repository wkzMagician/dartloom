name: dartloom_sync_storage
description: Isomorphic JSON replica and durable state adapters for Dartloom Sync.
version: 0.1.0
repository: https://github.com/wkzMagician/dartloom
environment:
  sdk: ^3.5.0
dependencies:
  crypto: ^3.0.3
  dartloom_settings:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      path: packages/dartloom_settings
  dartloom_storage:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      path: packages/dartloom_storage
  dartloom_sync:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      path: packages/dartloom_sync
dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.8
