name: Dartloom Flutter Release
on:
  workflow_call:
    permissions:
      contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      # Build a Universal APK for the public GitHub Release. Keep the AAB
      # as an internal CI artifact for app-store submission.
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/**
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/**/Release/**
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_files
          find . -type f ! -name '*.aab' -exec cp {} release_files/ \;
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release_files/*
